name: Set up Node.js environment
description: 'Set up Node.js environment for acceptance tests'

runs:
  using: "composite"
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install and enable Corepack
      shell: bash
      run: |
        npm install --global corepack@latest
        corepack enable

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - uses: actions/cache@v6
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: make install

    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: |
        echo "version=$(pnpm exec playwright --version | tail -1 | awk '{print $2}')" >> $GITHUB_OUTPUT

    - uses: actions/cache@v6
      id: playwright-cache
      name: Setup Playwright browsers cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    # The system dependencies (--with-deps) are not installed, because the
    # GitHub Ubuntu runners already ship them, and fetching them with apt is
    # sometimes very slow.
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install chromium

inputs:
  node-version:
    description: 'Node.js version'
    required: true
