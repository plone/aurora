name: Publish npm packages

on:
  push:
    tags:
      - 'plone-*'
      - '[0-9]*'

permissions:
  contents: read

# One publication at a time. Each run publishes every allowlisted package whose
# version at the tagged commit is not on npm yet, so a pending run that GitHub
# replaces with a newer one loses nothing.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:deps
      - name: Publish unpublished packages using npm trusted publishing
        run: node packages/scripts/publish-packages.js
