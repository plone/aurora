name: Cookieplone
on: [push, pull_request]

env:
  python-version: '3.13'
  # The templates that generate the thin app, until
  # plone/cookieplone-templates#513 is merged. Then remove this line.
  COOKIEPLONE_REPOSITORY_TAG: sneridagh/aurora-thin-app

# Cancel the runs of a branch or pull request that a newer push supersedes,
# except on main, where every commit runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  aurora:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    name: Aurora
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [26.x]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js environment
        uses: ./.github/actions/node_env_setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        timeout-minutes: 5
        with:
          python-version: ${{ env.python-version }}
          enable-cache: false

      # The control panels publish their compiled CSS, which build-deps doesn't build.
      - name: Build the control panels CSS
        run: pnpm --filter @plone/controlpanels build:css

      - name: Generate Cookieplone-based frontend addon
        run: |
          uvx --prerelease allow cookieplone aurora_addon --no-input

      # The generated add-on is a thin app that installs `@plone/aurora` from
      # npm. Install the packages of this branch, packed as npm would install
      # them, then type check, build and serve it.
      - name: Build and serve the generated add-on with the packed packages
        run: node packages/scripts/check-thin-app.js --project plone-aurora-add-on

      - name: Run linters in the generated package
        working-directory: plone-aurora-add-on
        run: make lint

      - name: Run formatters in the generated package
        working-directory: plone-aurora-add-on
        run: make format

      - name: Run unit tests in the generated package
        working-directory: plone-aurora-add-on
        run: make ci-test
