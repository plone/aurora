packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
  - 'apps/aurora'
  # exclude packages that are inside test directories
  - '!**/test/**'
  # exclude Volto packages, leaving them as reference
  - '!packages/volto*'

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '*stylelint*'
  - '*playwright*'

overrides:
  react: ^19.2.7
  react-dom: ^19.2.7
  jotai: ^2.12.5

# Deduplicate compatible dependency versions on every install (pnpm 12.6+).
autoDedupe: true

# Drop `minimumReleaseAgeExclude` entries once they are old enough.
minimumReleaseAgeExcludePrune: true

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  lightningcss-cli: true
  msgpackr-extract: true
  unrs-resolver: true

# The default pnpm catalog is loaded from `catalog.json` using `.pnpmfile.cjs`.
# If you want to customize the versions of the catalog, do it in there.
