name: Visual Regression Tests

# Compares the editor and public view against the baseline screenshots stored
# in the public plone/aurora-visual-regression repository.
#
# It runs nightly on the default branch instead of on every pull request, so
# contributors aren't blocked by screenshot diffs. It can also be started by
# hand on any branch (e.g. before merging styling work). Read-only: baselines
# are only updated through the "Update VRT Screenshots" workflow.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    name: Visual regression
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Checkout visual regression baselines
        uses: actions/checkout@v7
        with:
          repository: plone/aurora-visual-regression
          ref: main
          path: playwright/__screenshots__
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/acceptance_tests_node_env_setup
        with:
          node-version: 24.x

      # The Quanta component screenshots run against the static Storybook,
      # which the visual config serves itself.
      - name: Build the Quanta Storybook
        run: pnpm --filter @plone/quanta build-storybook --quiet

      - uses: JarvusInnovations/background-action@v2
        name: Start Servers - Aurora and Plone
        with:
          run: |
            make ci-acceptance-backend-start &
            make acceptance-frontend-prod-start &
          wait-on: |
            http-get://localhost:55001/plone
            http://localhost:3000
          tail: true
          log-output-resume: stderr
          wait-for: 10m
          log-output: stderr,stdout
          log-output-if: failure

      # The app tests run first, on their own: when the Quanta tests run at the
      # same time, they take every CPU, and Chrome renders the app's images
      # slightly differently under that load. The Quanta tests run even if
      # the app tests failed.
      - name: Run the app visual regression tests
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/app
        run: pnpm visual-test --project=chromium --output=playwright/results-visual/app --reporter=list,html

      - name: Run the Quanta visual regression tests
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/quanta
        run: pnpm visual-test --project=quanta --output=playwright/results-visual/quanta --reporter=list,html

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-regression-results
          path: |
            playwright/results-visual/
            playwright-report/
          retention-days: 15
