name: Changelog check
on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

env:
  node-version: 24.x

jobs:
  towncrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch all history
          fetch-depth: '0'

      - name: Install towncrier
        run: pip install towncrier

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            aurora:
              - 'apps/aurora/**'
            client:
              - 'packages/client/**'
            registry:
              - 'packages/registry/**'
            components:
              - 'packages/components/**'
            cmsui:
              - 'packages/cmsui/**'
            helpers:
              - 'packages/helpers/**'
            types:
              - 'packages/types/**'
            publicui:
              - 'packages/publicui/**'
            plate:
              - 'packages/plate/**'
            reactrouter:
              - 'packages/react-router/**'
            blocks:
              - 'packages/blocks/**'
            layout:
              - 'packages/layout/**'
            theming:
              - 'packages/theming/**'
            wrongNews:
              - added|modified: 'news/**'

      - name: Aurora changelog check
        if: steps.filter.outputs.aurora == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir apps/aurora
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: CMSUI changelog check
        if: steps.filter.outputs.cmsui == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/cmsui
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Client changelog check
        if: steps.filter.outputs.client == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/client
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Registry changelog check
        if: steps.filter.outputs.registry == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/registry
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Components changelog check
        if: steps.filter.outputs.components == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/components
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Helpers changelog check
        if: steps.filter.outputs.helpers == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/helpers
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Types changelog check
        if: steps.filter.outputs.types == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/types
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Public UI changelog check
        if: steps.filter.outputs.publicui == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/publicui
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Plate changelog check
        if: steps.filter.outputs.plate == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/plate
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: React Router changelog check
        if: steps.filter.outputs.reactrouter == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/react-router
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Blocks changelog check
        if: steps.filter.outputs.blocks == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/blocks
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Layout changelog check
        if: steps.filter.outputs.layout == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/layout
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Theming changelog check
        if: steps.filter.outputs.theming == 'true'
        run: |
          git fetch --no-tags origin main
          towncrier check --compare-with origin/main --dir packages/theming
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Wrong location of news changelog check
        if: steps.filter.outputs.wrongNews == 'true'
        run: echo "News items should be moved from the repository root to the appropriate package root in `packages/package-name`." && exit 1
        env:
          BASE_BRANCH: ${{ github.base_ref }}
