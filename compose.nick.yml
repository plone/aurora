services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nick
      POSTGRES_PASSWORD: nick
      POSTGRES_DB: nick
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nick -d nick']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - data:/var/lib/postgresql

  nick:
    image: plone/nick:3.0.0
    environment:
      DB_HOST: db
      DB_USER: nick
      DB_PASSWORD: nick
      DB_NAME: nick
      SECRET: local-nick-development-secret
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT: '1000'
      API_RATE_LIMIT: '1000'
    ports:
      - '${NICK_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - blobs:/app/var/blobstorage

volumes:
  data:
  blobs:
