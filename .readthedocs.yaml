# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "24"
  commands:
    # First fetch the changes from the non-primary branch.
    #
    # Cancel building pull requests when there aren't changes in the docs directory or YAML file.
    # You can add any other files or directories that you'd like here as well,
    # like your docs requirements file, or other files that will change your docs build.
    #
    # If there are no changes (git diff exits with 0) we force the command to return with 183.
    # This is a special exit code on Read the Docs that will cancel the build immediately.
    - |
      git fetch origin main
      if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- \
        docs/ \
        packages/cmsui/.storybook/ \
        packages/cmsui/**/*.stories.* \
        packages/components/.storybook/ \
        packages/components/**/*.stories.* \
        packages/layout/.storybook/ \
        packages/layout/**/*.stories.* \
        packages/registry/.storybook/ \
        packages/registry/**/*.stories.* \
        .readthedocs.yaml \
        requirements-docs.txt;
      then
        exit 183;
      fi
    # Install dependencies defined in your ``package.json``
    # - npm ci
    # Install any other extra dependencies to build the docs
    # - npm install --global corepack@latest
    # - corepack enable
    # - corepack prepare pnpm@* --activate
    # - asdf reshim nodejs
    # - pnpm install
    # - pnpm build:registry
    # - (cd packages/volto && pnpm build-storybook -o ${READTHEDOCS_OUTPUT}/html/storybook)
    - make docs-rtd-pr-preview
